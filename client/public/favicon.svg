<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62020" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#ff4d4d" stroke-width="4" filter="url(#glow)"/>
  <!-- Number 12 Typography -->
  <text x="64" y="86" font-family="'Kanit', 'Arial Black', sans-serif" font-weight="900" font-size="64" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="-4">12</text>
  <!-- Mini Gold Sparkle / Star -->
  <polygon points="98,28 102,38 112,42 102,46 98,56 94,46 84,42 94,38" fill="url(#goldGrad)" />
</svg>
